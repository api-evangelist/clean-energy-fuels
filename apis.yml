description: 'Clean Energy Fuels Corp. (Nasdaq: CLNE) is North America''s largest provider of renewable natural
  gas (RNG) for the transportation industry. It produces RNG at dairy-farm and landfill facilities and delivers
  it as CNG or LNG through a network of more than 600 fueling stations across the United States and Canada, alongside
  hydrogen fueling, bulk LNG and turnkey fleet services. The company publishes no developer program, public API,
  SDK or machine-readable contract; its only machine-readable surface is an llms.txt at the apex domain and a React
  station locator that reads static JSON from a contractor''s GitHub repository.'
